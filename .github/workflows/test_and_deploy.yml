# Tests on push/PR. Pushing a "v*" tag also creates a GitHub release with the
# built wheel and sdist attached (PyPI publishing is disabled, see below)
name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    permissions:
      id-token: write  # needed for codecov OIDC authentication
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - platform: windows-latest
            python-version: "3.12"
          - platform: macos-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Setup python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          activate-environment: "true"
      - name: Setup headless display
        uses: pyvista/setup-headless-display-action@v4.3
        with:
          qt: true
          wm: herbstluftwm


      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        run: uvx --with tox-gh-actions tox
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Coverage
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true  # reliable tokenless codecov uploads

  build-and-inspect-package:
    name: Build & inspect package.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: hynek/build-and-inspect-python-package@v2

  release:
    # runs when a commit is tagged "v*": attaches the built wheel and sdist to
    # a GitHub release (no PyPI)
    needs: [test, build-and-inspect-package]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifact to dist/
        uses: actions/download-artifact@v8
        with:
          name: Packages
          path: dist
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" dist/*
          --repo "${{ github.repository }}"
          --title "${{ github.ref_name }}" --generate-notes

  # To publish on PyPI later, replace the job above with this one (requires a
  # PyPI trusted publisher configured for this repository)
